<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Confirmar novo e-mail · Reescala</title>
    <link rel="icon" type="image/png" href="/logos/Reescala_original_transparente.png">
    <meta name="theme-color" content="#0B2545">
    <script src="/assets/js/theme.js"></script>
    <link rel="stylesheet" href="/assets/css/login.css" />
    <link rel="stylesheet" href="/assets/css/motion.css" />
    <link rel="stylesheet" href="/assets/css/theme.css">
    <link rel="stylesheet" href="/assets/css/theme-dark.css">
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand"><img data-theme-logo src="/logos/Reescala_original_transparente.png" alt="" width="64" height="56" style="width:64px;height:56px;max-width:64px;object-fit:contain;flex-shrink:0"><span>Reescala<small class="brand-slogan">Jornadas em equilíbrio</small></span></div>
      <h1 id="email-title">Confirmar novo e-mail</h1>
      <p id="email-status" class="login-info" role="status" aria-live="polite">Confirme para passar a entrar no Reescala com este endereço. O link vale por 24 horas.</p>
      <form id="email-form" novalidate>
        <button type="submit">Confirmar novo e-mail</button>
      </form>
      <div id="email-done" class="login-sucesso" hidden>
        <p></p>
        <a class="login-botao" href="/login.html">Entrar no Reescala</a>
      </div>
      <footer class="app-footer"><p>Desenvolvido pela <a href="https://fintria.com.br" target="_blank" rel="noopener noreferrer">Fintria</a></p></footer>
    </main>
    <script type="module" src="/assets/js/confirmar-email.js"></script>
  </body>
</html>
