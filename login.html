<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · Reescala</title>
<link rel="icon" type="image/png" href="/logos/Reescala_original_transparente.png">
<link rel="apple-touch-icon" href="/logos/Reescala_preto_fundo_branco.png">
<meta name="theme-color" content="#0B2545">
    <link rel="stylesheet" href="/assets/css/login.css" />
    <link rel="stylesheet" href="/assets/css/motion.css" />
  </head>
  <body>
    <main class="login-card">
      <div class="brand"><img src="/logos/Reescala_original_transparente.png" alt="" width="64" height="56" style="width:64px;height:56px;max-width:64px;object-fit:contain;flex-shrink:0"><span>Reescala</span></div>
      <h1>Acesse o sistema</h1>
      <p id="login-description">Informe a senha de acesso para continuar. Sua sessão dura até 12 horas.</p>
      <form id="login-form">
        <div id="login-email" hidden><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" /></div>
        <label for="password">Senha</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
          maxlength="256"
        /><button type="submit">Entrar</button>
        <p id="login-message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script type="module" src="/assets/js/login.js"></script>
  </body>
</html>
