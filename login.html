  <body class="login-page">
    <main class="login-card">
      <svg class="christmas-detail" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true" focusable="false"><title>Boas festas! Jornadas em equilíbrio.</title><path d="M16 21C5 23 4 15 4 9c3 1 5 0 7-2 0 4 5 5 5 14Z" fill="#448468"/><path d="M17 21c-2-10 5-15 11-16-1 3 0 5 2 7-4 0-6 7-13 9Z" fill="#75ad88"/><path d="m8 12 8 10M24 10l-8 12" fill="none" stroke="#c0d6bd" stroke-width="1" stroke-linecap="round"/><circle cx="14" cy="23" r="3" fill="#bd4c5b"/><circle cx="20" cy="22" r="3" fill="#d96e73"/><circle cx="18" cy="27" r="2.6" fill="#bd4c5b"/><path class="christmas-sparkle" d="m5 1 1.1 2.9L9 5 6.1 6.1 5 9 3.9 6.1 1 5l2.9-1.1Z" fill="#d5ad65"/></svg>

      <h1>Acesse o sistema</h1>
      <form id="login-form">
        <div id="login-email" hidden><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" /></div>
        <label for="password">Senha</label

          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus
          maxlength="256"
        /><button type="submit">Entrar</button>
        <p id="login-message" role="status" aria-live="polite"></p>
      </form>
      <footer class="app-footer"><p>Desenvolvido pela <a href="https://fintria.com.br" target="_blank" rel="noopener noreferrer" aria-label="Fintria (abre em nova aba)">Fintria</a></p><button id="btn-theme" type="button" class="theme-toggle no-print" data-theme-toggle role="switch" aria-checked="false" aria-label="Tema escuro"><span data-theme-icon aria-hidden="true">☀</span><span class="sidebar-label">Tema escuro</span><span class="theme-switch" aria-hidden="true"></span></button></footer>
