<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Administração — CJS Escala</title>
    <link rel="stylesheet" href="/assets/css/admin.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CJS Escala</p>
          <h1>Administração de usuários</h1>
        </div>
        <a href="/">Voltar ao sistema</a>
      </header>
      <p>
        Cadastre contas autorizadas e defina o escritório e as empresas que
        poderão acessar.
      </p>
      <form id="admin-unlock" hidden>
        <h2>Acesso administrativo</h2>
        <label
          >Senha de administrador<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="256" /></label
        ><button>Desbloquear</button>
      </form>
      <section id="admin-area" hidden>
        <div class="section-heading">
          <h2>Novo usuário</h2>
          <button id="admin-lock" type="button" class="secondary">
            Bloquear administração
          </button>
        </div>
        <form id="admin-create">
          <label
            >Nome completo<input
              name="name"
              required
              maxlength="160"
              autocomplete="off"
          /></label>
          <label
            >E-mail de acesso<input
              name="email"
              type="email"
              required
              maxlength="254"
              autocomplete="off"
          /></label>
          <label
            >Senha inicial<input
              name="password"
              type="password"
              required
              minlength="6"
              maxlength="72"
              autocomplete="new-password"
            /><small
              >Mínimo de 6 caracteres. Informe a senha ao usuário por um canal
              privado.</small
            ></label
          >
          <label
            >Confirmar senha<input
              name="confirmation"
              type="password"
              required
              minlength="6"
              maxlength="72"
              autocomplete="new-password"
          /></label>
          <label>Escritório<select name="officeId" required></select></label>
          <label
            >Permissão<select name="role">
              <option value="editor">Edição</option>
              <option value="viewer">Somente consulta</option>
              <option value="admin">Administrador do escritório</option>
            </select></label
          >
          <p id="admin-role-help"></p>
          <fieldset>
            <legend>Empresas autorizadas</legend>
            <div id="admin-companies"></div>
          </fieldset>
          <button id="admin-submit">Criar usuário</button>
        </form>
      </section>
      <p id="admin-status" role="status" aria-live="polite">
        Verificando acesso…
      </p>
    </main>
    <script type="module" src="/assets/js/admin.js"></script>
  </body>
</html>
